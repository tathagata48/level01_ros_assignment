# =============================================================================
#  map_server (nav2_map_server) - loads the static occupancy grid
#  Docs: https://docs.nav2.org/configuration/packages/configuring-map-server.html
# =============================================================================
map_server:
  ros__parameters:
    use_sim_time: true
    # Full path to the map YAML. Left empty on purpose: map_loader.launch.py
    # overrides it with the `map` launch argument (default:
    # <testbed_bringup share>/maps/testbed_world.yaml).
    yaml_filename: ""
    # Topic the OccupancyGrid is published on (latched / transient-local QoS)
    topic_name: "map"
    # Frame the map is expressed in. AMCL and the global costmap use this frame.
    frame_id: "map"
